[project]
name = "mcp-server"
version = "0.1.0"
description = "Minimal MCP Python server built with the official MCP SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pyjwt[crypto]>=2.15.1",
    "redis>=5.0",
]

[project.scripts]
mcp-server = "mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
